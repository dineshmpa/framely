<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Framely — Profile picture frames{% endblock %}</title>
  {% block meta %}<meta name="description" content="Add a campaign frame to your profile picture and share it on social media.">{% endblock %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235b4bff' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ root }}static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ root }}"><span class="brand-mark"></span>Framely</a>
      <nav>
        <a href="{{ root }}#explore">Explore</a>
        <a class="btn btn-primary btn-sm" href="{{ root }}try/">Try your own frame</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer"><div class="container">Framely · Photos are processed in your browser and never uploaded.</div></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
